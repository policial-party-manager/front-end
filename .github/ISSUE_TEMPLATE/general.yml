name: 问题反馈与功能需求
description: 提交缺陷、功能改进、文档或其他项目事项
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: 事项类型
      options:
        - 问题反馈
        - 功能需求
        - 文档改进
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 背景与目标
      description: 描述遇到的问题或希望完成的事项，以及相关背景。
      placeholder: 请清楚说明当前情况和希望解决的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 问题反馈请填写；功能需求可留空。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与验收标准
      description: 描述修复后的表现或完成标准。
      placeholder: 完成后应当……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 问题反馈请填写；功能需求可留空。
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附页面、浏览器、截图、日志或相关链接。
    validations:
      required: false
