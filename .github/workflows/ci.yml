name: 前端 CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  lint:
    name: 代码检查（Lint）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Prettier 格式检查
        run: npm run format:check

      - name: ESLint 检查
        run: npx eslint src --ext .vue,.ts,.js

  typecheck:
    name: TypeScript 类型检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

  branch-regressions:
    name: 支部表单回归
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium
      - name: 浏览器回归
        run: npm run test:branches

  activity-participation-regressions:
    name: 活动参与管理回归
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium
      - name: 浏览器回归
        run: npm run test:activity-participation
      - name: 回归脚本与 CI 格式
        run: npx prettier scripts/activity-participation-regressions.test.mjs .github/workflows/ci.yml --check

  member-import-regressions:
    name: 成员导入回归
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium
      - name: 浏览器回归
        run: npm run test:member-import

  member-management-regressions:
    name: 成员管理回归
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium
      - name: 浏览器回归
        run: npm run test:members
      - name: 权限与预览策略
        run: npm run check:permissions
      - name: 回归脚本与 CI 格式
        run: npx prettier scripts/check-permissions.mjs scripts/member-management-regressions.test.mjs scripts/member-import-regressions.test.mjs scripts/system-roles-regressions.test.mjs scripts/system-logs-regressions.test.mjs .github/workflows/ci.yml --check

  system-management-regressions:
    name: 系统管理回归
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium
      - name: 角色与日志浏览器回归
        run: npm run test:system
      - name: 权限与预览策略
        run: npm run check:permissions

  build:
    name: 生产构建
    needs:
      [
        lint,
        typecheck,
        branch-regressions,
        activity-participation-regressions,
        member-import-regressions,
        member-management-regressions,
        system-management-regressions,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  enable-auto-merge:
    name: 开启自动合并
    needs: [lint, typecheck, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 等待必需检查和审查后合并
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
